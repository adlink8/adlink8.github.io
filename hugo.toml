baseURL = 'https://adlink8.github.io/'
theme = 'PaperMod'

# Multilingual: English at site root, Chinese under /zh/
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[taxonomies]
    category = "categories"
    tag = "tags"

[pagination]
    pageSize = 10

# Output formats required for search functionality
[outputs]
    home = ["HTML", "RSS", "JSON"]
    section = ["HTML"]
    taxonomy = ["HTML"]
    term = ["HTML"]

# =======================================================
# SHARED PARAMS (both languages)
# =======================================================
[params]
    env = "production"
    author = "Li Shuo Yan"
    ShowCodeCopyButtons = true
    ShowReadingTime = true
    ShowPostNavLinks = true
    # Light by default (calmer first impression); visitors can toggle dark
    defaultTheme = "light"
    # Open Graph fallback image for social sharing cards
    images = ["/image/tx.jpg"]
    # Ensures only posts appear in the main content area
    mainSections = ["daily", "pitfalls", "reflections", "insights", "project-logs"]

    # Comments via giscus (GitHub Discussions). Flip to true after:
    # 1. enabling Discussions on the repo (Settings > General > Features)
    # 2. installing the giscus app: https://github.com/apps/giscus
    # 3. creating an "Announcements" discussion category and pasting its ID below
    comments = false
    [params.giscus]
        repo = "adlink8/adlink8.github.io"
        repoId = "R_kgDORRQung"
        category = "Announcements"
        categoryId = "" # paste category node ID here (get it from https://giscus.app)
        mapping = "pathname"
        theme = "preferred_color_scheme"

    # Analytics: set your GoatCounter site code to enable (free signup at goatcounter.com)
    # goatcounter = "shuoyan"

    # Social Media Links
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/adlink8"
    # TODO: replace with your real LinkedIn profile URL (https://www.linkedin.com/in/<you>)
    # The old value linkedin.com/feed/ sends visitors to their own feed, not your profile.
    # [[params.socialIcons]]
    #     name = "linkedin"
    #     url = "https://www.linkedin.com/in/your-handle"

# =======================================================
# ENGLISH (default, served at /)
# =======================================================
[languages]
  [languages.en]
    languageCode = 'en-us'
    languageName = 'English'
    contentDir = 'content/en'
    title = 'ShuoYan | Engineering Portfolio'
    [languages.en.params]
        description = "DevOps engineering notes: CI/CD, containers, cloud infrastructure and the systems I build."
        [languages.en.params.homeInfoParams]
            Title = ""
            Content = """
![Avatar](/image/tx.jpg)

# Hi, I'm Li Shuo Yan

**DevOps Engineer — CI/CD, Containers & Cloud Infrastructure**

I ship working systems, not tutorial replicas: 3 delivered projects, 11k+ events ingested, 40k+ knowledge units under management.

---

### Learning Tracks
- 📅 Timeline: **[Daily Progress](/daily/)**
- 🛠️ Lab Notes: **[Troubleshooting](/pitfalls/)**
- 💡 Insights: **[Architecture](/insights/)**
- 🔄 Reflection: **[Retrospectives](/reflections/)**
- 📁 Project Logs: **[Build Progress](/project-logs/)**
"""

    [[languages.en.menu.main]]
        identifier = "daily"
