name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"] # 仅在 main 分支提交时触发
  workflow_dispatch:   # 允许手动触发
  schedule:
    # 每周一 UTC 04:17 重建一次，让 Stats 页的 streak / "days since" 保持新鲜
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 关键：自动拉取你刚才添加的 PaperMod 子模块
          fetch-depth: 0         # 获取完整历史，方便 Hugo 读取 Git 修改时间

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true        # 许多主题需要 extended 版本处理 SCSS

      - name: Build with Hugo
        run: hugo --minify

      # 死链检查：报告但不阻断部署（外部站点偶尔误报）
      - name: Check links (non-blocking)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --exclude-loopback './public/**/*.html'
          fail: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4