name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"] # 仅在 main 分支提交时触发
  workflow_dispatch:   # 允许手动触发
  schedule:
    # 每周一 UTC 04:17 重建一次，让 Stats 页的 streak / "days since" 保持新鲜
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive # 关键：自动拉取你刚才添加的 PaperMod 子模块
          fetch-depth: 0         # 获取完整历史，方便 Hugo 读取 Git 修改时间

      # 直接从 GitHub Releases 装 Hugo 二进制（固定与本地一致的版本），
      # 避开 peaceiris/actions-hugo 第三方 action 的 codeload 429 限流
      - name: Setup Hugo
        run: |
          curl -sSL https://github.com/gohugoio/hugo/releases/download/v0.165.0/hugo_extended_0.165.0_linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build with Hugo
        run: hugo version && hugo --minify

      # 简历 PDF：无头 Chrome 按打印样式渲染 /resume/ 与 /zh/resume/，
      # 每次部署重新生成 → 页面上的下载链接永远与线上简历内容一致。
      # fonts-noto-cjk 保证中文渲染；产物不进 git，只进部署产物。
      - name: Generate resume PDFs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          echo "Using browser: $CHROME"
          python3 -m http.server 1313 --directory public &
          SERVER_PID=$!
          sleep 2
          for variant in "resume.pdf:/resume/" "zh/resume.pdf:/zh/resume/"; do
            out="${variant%%:*}"; path="${variant#*:}"
            "$CHROME" --headless=new --disable-gpu --no-sandbox \
              --no-pdf-header-footer --print-to-pdf="public/$out" \
              "http://127.0.0.1:1313$path"
          done
          kill "$SERVER_PID"
          ls -la public/resume.pdf public/zh/resume.pdf

      # 死链检查：报告但不阻断部署（外部站点偶尔误报）。
      # 同样用官方 release 二进制（v0.24.2），避开 lychee-action 的 codeload 限流
      - name: Check links (non-blocking)
        continue-on-error: true
        run: |
          curl -sSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP" lychee
          "$RUNNER_TEMP/lychee" --no-progress --exclude-loopback './public/**/*.html' || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4