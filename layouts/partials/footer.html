<div id="scroll-progress" aria-hidden="true"></div>

<!-- Day/night sky background: moon + meteors (dark), sunlight rays (light) -->
<div class="sky" aria-hidden="true">
    <div class="sky-blue"></div>
    <div class="stars stars-a"></div>
    <div class="stars stars-b"></div>
    <div class="moon"></div>
    <div class="sun"></div>
    <div class="sunrays"></div>
    <div class="sunrays sunrays-b"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
    <div class="cloud cloud-6"></div>
    <div class="cloud cloud-7"></div>
    <div class="mist mist-a"></div>
    <div class="mist mist-b"></div>
    <div class="mist mist-c"></div>

    <!-- Van Gogh swirls for the rare "Starry Night" egg (dark only) -->
    <div class="vangogh" aria-hidden="true">
        <div class="swirl swirl-1"></div>
        <div class="swirl swirl-2"></div>
        <div class="swirl swirl-3"></div>
        <div class="swirl swirl-4"></div>
        <div class="swirl swirl-5"></div>
    </div>

    <!-- Scorpius constellation (Oct 23 – Nov 21), drawn star by star -->
    <svg class="constellation" viewBox="0 0 100 150" aria-hidden="true">
        <polyline class="con-lines" points="40,8 50,15 58,22 55,38 52,55 48,72 38,88 28,100 30,114 38,126 52,132 64,128 72,120 78,112"/>
        <circle class="con-star" cx="40" cy="8" r="1.4" style="--i:0"/>
        <circle class="con-star" cx="50" cy="15" r="1.6" style="--i:1"/>
        <circle class="con-star" cx="58" cy="22" r="1.3" style="--i:2"/>
        <circle class="con-star" cx="55" cy="38" r="1.2" style="--i:3"/>
        <circle class="con-star con-antares" cx="52" cy="55" r="2.4" style="--i:4"/>
        <circle class="con-star" cx="48" cy="72" r="1.3" style="--i:5"/>
        <circle class="con-star" cx="38" cy="88" r="1.5" style="--i:6"/>
        <circle class="con-star" cx="28" cy="100" r="1.2" style="--i:7"/>
        <circle class="con-star" cx="30" cy="114" r="1.3" style="--i:8"/>
        <circle class="con-star" cx="38" cy="126" r="1.4" style="--i:9"/>
        <circle class="con-star" cx="52" cy="132" r="1.3" style="--i:10"/>
        <circle class="con-star" cx="64" cy="128" r="1.4" style="--i:11"/>
        <circle class="con-star" cx="72" cy="120" r="1.6" style="--i:12"/>
        <circle class="con-star" cx="78" cy="112" r="1.2" style="--i:13"/>
        <text class="con-label" x="46" y="148">Scorpius</text>
    </svg>
</div>

<footer class="footer">
    <div id="quote-container" class="footer-quote"></div>
    <nav class="footer-links" aria-label="Footer">
        <a href="{{ "/resume/" | relLangURL }}">{{ i18n "nav_resume" }}</a>
        <span class="footer-sep">·</span>
        <a href="{{ "/now/" | relLangURL }}">{{ i18n "nav_now" }}</a>
        <span class="footer-sep">·</span>
        <a href="{{ "/archives/" | relLangURL }}">{{ i18n "nav_archives" }}</a>
        <span class="footer-sep">·</span>
        <a href="{{ "/stats/" | relLangURL }}">{{ i18n "nav_stats" }}</a>
        <span class="footer-sep">·</span>
        <a href="{{ "index.xml" | relLangURL }}" title="RSS Feed">RSS</a>
    </nav>
    <span>&copy; {{ now.Year }} {{ site.Title }}</span>
</footer>

<script>
(function() {
    'use strict';

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /**
     * Meteor Shower (generated)
     * Dozens of meteors with randomized orbits; CSS keyframes do the falling.
     * Hidden by CSS in light mode.
     */
    var sky = document.querySelector('.sky');
    if (sky && !reduceMotion) {
        var isMobile = window.matchMedia('(max-width: 768px)').matches;
        var COUNT = isMobile ? 18 : 36;
        for (var i = 0; i < COUNT; i++) {
            var m = document.createElement('div');
            m.className = 'meteor';
            m.style.top = (Math.random() * 45 - 5) + '%';
            m.style.left = (25 + Math.random() * 85) + '%';
            m.style.width = (50 + Math.random() * 120) + 'px';
            var dur = 5 + Math.random() * 11;
            m.style.animationDuration = dur + 's';
            m.style.animationDelay = (Math.random() * dur * 2) + 's';
            sky.appendChild(m);
        }
    }

    /**
     * 0. Theme Toggle
     * The theme's own handler lives in its footer partial, which this file
     * overrides — so we re-implement it here (same localStorage keys).
     */
    var themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', function() {
            var html = document.querySelector('html');
            if (html.dataset.theme === 'dark') {
                html.dataset.theme = 'light';
                localStorage.setItem('pref-theme', 'light');
            } else {
                html.dataset.theme = 'dark';
                localStorage.setItem('pref-theme', 'dark');
            }
        });
    }

    /**
     * 1. Heart-Pop Interaction
     * Triggers a heart animation when clicking the profile avatar only
     */
    if (!reduceMotion) {
        document.addEventListener('click', function(e) {
            var avatar = e.target.closest('.home-info p:first-child img, .sidebar-avatar');
            if (!avatar) return;
            var heart = document.createElement('div');
            heart.textContent = '❤️';
            heart.className = 'heart-pop';
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            document.body.appendChild(heart);
            setTimeout(function() { heart.remove(); }, 1000);
        });
    }

    /**
     * 2. Random Quote Generator
     * Injects a random technical quote into the footer
     */
    var quotes = [
        '“Slow is smooth, smooth is fast.”'
    ];
    var quoteEl = document.getElementById('quote-container');
    if (quoteEl) {
        quoteEl.textContent = quotes[Math.floor(Math.random() * quotes.length)];
    }

    /**
     * 3. Console Easter Egg
     * Displays recruitment info in browser DevTools for inquisitive engineers
     */
    var recruitStyle = "background: #8a2be2; color: #fff; font-size: 20px; font-weight: bold; border-radius: 5px; padding: 10px;";
    console.log("%c Hi! Looking for a DevOps Engineer? ", recruitStyle);
    console.log("%c Contact me at: 2448366060l@email.com ", "color: #8a2be2; font-family: monospace;");
    console.log("%c psst… ↑↑↓↓←→←→BA · click the moon · type \"starry\"/\"scorpio\"/\"rocket\" · logo ×5 · draw a circle · Oct 25 🎂", "color: #8a2be2; font-family: monospace;");

    /**
     * 4. Reading Progress Bar (rAF-throttled)
     */
    var progBar = document.getElementById('scroll-progress');
    if (progBar) {
        var ticking = false;
        var updateProgress = function() {
            var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            progBar.style.width = scrolled + '%';
            ticking = false;
        };
        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(updateProgress);
                ticking = true;
            }
        }, { passive: true });
        updateProgress();
    }

    /**
     * 6. Code Block Language Labels
     * Replaces the decorative "zsh — 80x24" tag with the real language name
     */
    document.querySelectorAll('.post-content pre').forEach(function(pre) {
        if (pre.closest('.linenodiv')) return; // skip line-number gutter
        var host = pre.closest('.highlight') || pre;
        if (host.querySelector('.code-lang')) return; // one label per block
        var code = pre.querySelector('code');
        if (!code) return;
        var lang = code.getAttribute('data-lang')
            || (code.className.match(/language-(\w+)/) || [])[1]
            || 'text';
        host.classList.add('has-lang');
        var tag = document.createElement('span');
        tag.className = 'code-lang';
        tag.textContent = lang;
        host.appendChild(tag);
    });

    /**
     * 7. TOC Scroll-Spy
     * Highlights the current section in the table of contents
     */
    var tocLinks = document.querySelectorAll('.toc a[href^="#"]');
    if (tocLinks.length && 'IntersectionObserver' in window) {
        var linkFor = {};
        var heads = [];
        tocLinks.forEach(function(a) {
            var id = decodeURIComponent(a.getAttribute('href').slice(1));
            var h = document.getElementById(id);
            if (h) { linkFor[id] = a; heads.push(h); }
        });
        var spy = new IntersectionObserver(function(entries) {
            entries.forEach(function(en) {
                if (!en.isIntersecting) return;
                tocLinks.forEach(function(l) { l.classList.remove('active-toc'); });
                var a = linkFor[en.target.id];
                if (a) a.classList.add('active-toc');
            });
        }, { rootMargin: '-90px 0px -70% 0px' });
        heads.forEach(function(h) { spy.observe(h); });
    }

    /**
     * 7b. Timeline Axis Scroll-Spy (/daily/)
     */
    var axisLinks = document.querySelectorAll('.ta-day[href^="#post-"]');
    if (axisLinks.length && 'IntersectionObserver' in window) {
        var axisFor = {};
        var cards = [];
        axisLinks.forEach(function(a) {
            var id = decodeURIComponent(a.getAttribute('href').slice(1));
            var el = document.getElementById(id);
            if (el) { axisFor[id] = a; cards.push(el); }
        });
        var axisSpy = new IntersectionObserver(function(entries) {
            entries.forEach(function(en) {
                if (!en.isIntersecting) return;
                axisLinks.forEach(function(l) { l.classList.remove('active'); });
                var a = axisFor[en.target.id];
                if (a) a.classList.add('active');
            });
        }, { rootMargin: '-100px 0px -60% 0px' });
        cards.forEach(function(c) { axisSpy.observe(c); });
    }

    /**
     * 8. Stats Count-Up
     */
    var statNums = document.querySelectorAll('.stat-num');
    if (statNums.length && !reduceMotion && 'IntersectionObserver' in window) {
        var countUp = function(el) {
            var target = parseInt(el.textContent.replace(/\D/g, ''), 10) || 0;
            var duration = 900, t0 = null;
            var step = function(ts) {
                if (!t0) t0 = ts;
                var p = Math.min((ts - t0) / duration, 1);
                var eased = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(target * eased);
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        };
        var cObs = new IntersectionObserver(function(entries) {
            entries.forEach(function(en) {
                if (en.isIntersecting) { countUp(en.target); cObs.unobserve(en.target); }
            });
        }, { threshold: 0.5 });
        statNums.forEach(function(n) { cObs.observe(n); });
    }

    /**
     * 9. Image Lightbox
     */
    var zoomables = document.querySelectorAll('.post-content img');
    if (zoomables.length) {
        var lb = document.createElement('div');
        lb.className = 'lightbox';
        lb.setAttribute('role', 'dialog');
        lb.setAttribute('aria-label', 'Image preview');
        lb.innerHTML = '<img alt=""><span class="lightbox-close" aria-hidden="true">×</span>';
        document.body.appendChild(lb);
        var lbImg = lb.querySelector('img');
        var closeLb = function() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
        };
        zoomables.forEach(function(img) {
            img.classList.add('zoomable');
            img.addEventListener('click', function() {
                lbImg.src = img.currentSrc || img.src;
                lbImg.alt = img.alt || '';
                lb.classList.add('open');
                document.body.style.overflow = 'hidden';
            });
        });
        lb.addEventListener('click', closeLb);
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLb();
        });
    }

    /**
     * 10. External Link Markers (open in new tab, add ↗)
     */
    document.querySelectorAll('.post-content a[href^="http"]').forEach(function(a) {
        if (a.hostname === location.hostname) return;
        if (/(^|\.)(adlink8\.github\.io|shuoyan\.me)$/.test(a.hostname)) return;
        a.classList.add('ext-link');
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
    });

    /**
     * 11. Avatar Parallax + Card Tilt (desktop pointers only)
     */
    var finePointer = window.matchMedia('(pointer: fine)').matches;
    if (finePointer && !reduceMotion) {
        var avatar = document.querySelector('.first-entry.home-info p:first-child img');
        var homeCard = document.querySelector('.first-entry.home-info');
        if (avatar && homeCard) {
            homeCard.addEventListener('mousemove', function(e) {
                var r = homeCard.getBoundingClientRect();
                var dx = (e.clientX - r.left - r.width / 2) / r.width;
                var dy = (e.clientY - r.top - r.height / 2) / r.height;
                avatar.style.transform = 'translate(' + (dx * 8) + 'px, ' + (dy * 8) + 'px) scale(1.03)';
            });
            homeCard.addEventListener('mouseleave', function() {
                avatar.style.transform = '';
            });
        }

        document.querySelectorAll('.post-entry, .featured-card, .project-card, .stat-card')
            .forEach(function(card) {
                card.addEventListener('mousemove', function(e) {
                    var r = card.getBoundingClientRect();
                    var rx = ((e.clientY - r.top) / r.height - 0.5) * -2.5;
                    var ry = ((e.clientX - r.left) / r.width - 0.5) * 2.5;
                    card.style.transform = 'perspective(900px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translateY(-4px)';
                });
                card.addEventListener('mouseleave', function() {
                    card.style.transform = '';
                });
            });
    }

    /**
     * 12. Easter Eggs
     * - Konami code ↑↑↓↓←→←→BA : meteor storm (dark) / sunlight party (light)
     * - Click the moon / sun   : celestial reaction
     * - Oct 25 (birthday)      : toast + golden Scorpius
     */
    var isZh = (document.documentElement.lang || '').indexOf('zh') === 0;
    var eggToastTimer = null;
    var showToast = function(text, ms) {
        var t = document.querySelector('.egg-toast');
        if (!t) {
            t = document.createElement('div');
            t.className = 'egg-toast';
            t.setAttribute('role', 'status');
            document.body.appendChild(t);
        }
        t.textContent = text;
        t.classList.add('show');
        clearTimeout(eggToastTimer);
        eggToastTimer = setTimeout(function() { t.classList.remove('show'); }, ms || 3500);
    };

    var meteorBurst = function(count) {
        if (!sky || reduceMotion) return;
        for (var i = 0; i < count; i++) {
            (function(n) {
                setTimeout(function() {
                    var m = document.createElement('div');
                    m.className = 'meteor burst';
                    m.style.top = (Math.random() * 40 - 5) + '%';
                    m.style.left = (20 + Math.random() * 90) + '%';
                    m.style.width = (90 + Math.random() * 140) + 'px';
                    var dur = 0.7 + Math.random() * 0.9;
                    m.style.animationDuration = dur + 's';
                    m.style.animationIterationCount = '1';
                    sky.appendChild(m);
                    setTimeout(function() { m.remove(); }, dur * 1000 + 150);
                }, n * 120);
            })(i);
        }
    };

    var KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown',
                  'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    var kIdx = 0;
    document.addEventListener('keydown', function(e) {
        var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        kIdx = (k === KONAMI[kIdx]) ? kIdx + 1 : (k === KONAMI[0] ? 1 : 0);
        if (kIdx === KONAMI.length) {
            kIdx = 0;
            if (document.documentElement.dataset.theme === 'dark') {
                meteorBurst(30);
            } else {
                document.body.classList.add('party-sky');
                setTimeout(function() { document.body.classList.remove('party-sky'); }, 8000);
            }
            showToast(isZh ? '🌠 隐藏咒语生效！' : '🌠 Konami unlocked!');
        }
    });

    var moonEl = document.querySelector('.moon');
    var sunEl = document.querySelector('.sun');
    if (moonEl) {
        moonEl.addEventListener('click', function() {
            meteorBurst(6);
            showToast(isZh ? '🌙 你戳了一下月亮' : '🌙 You poked the moon');
        });
    }
    if (sunEl) {
        sunEl.addEventListener('click', function() {
            document.body.classList.add('party-sky');
            setTimeout(function() { document.body.classList.remove('party-sky'); }, 3000);
            showToast(isZh ? '☀️ 小心刺眼' : '☀️ Careful, it\'s bright');
        });
    }

    var today = new Date();
    if (today.getMonth() === 9 && today.getDate() === 25) {
        var con = document.querySelector('.constellation');
        if (con) con.classList.add('birthday');
        setTimeout(function() {
            showToast(isZh ? '🎂 今天是博主的生日，天蝎座 full power！'
                           : '🎂 It\'s the author\'s birthday — Scorpius at full power!', 6000);
        }, 1500);
    }

    /**
     * 13. More Eggs — typed words, Van Gogh starry night, logo disco,
     * late-night owl, copy toast, circle gesture
     */
    var starryTimer = null;
    var starryNight = function(auto) {
        if (!sky || reduceMotion) return;
        if (document.documentElement.dataset.theme !== 'dark') {
            showToast(isZh ? '🎨 星月夜只在黑夜出现' : '🎨 The Starry Night only shows at night');
            return;
        }
        sky.classList.add('starry');
        clearTimeout(starryTimer);
        starryTimer = setTimeout(function() { sky.classList.remove('starry'); }, 40000);
        showToast(auto ? (isZh ? '🎨 今晚的夜空是梵高画的（稀有彩蛋）' : '🎨 Van Gogh painted tonight\'s sky (rare!)')
                       : (isZh ? '🎨 星月夜' : '🎨 The Starry Night'));
    };

    // typed words: "starry" / "scorpio" / "rocket" (skipped while typing in inputs)
    var typeBuf = '';
    document.addEventListener('keydown', function(e) {
        if (e.key.length !== 1 || !/[a-z]/i.test(e.key)) return;
        var ae = document.activeElement;
        if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) return;
        typeBuf = (typeBuf + e.key.toLowerCase()).slice(-8);
        if (typeBuf.endsWith('starry')) {
            typeBuf = '';
            starryNight(false);
        } else if (typeBuf.endsWith('scorpio')) {
            typeBuf = '';
            var c = document.querySelector('.constellation');
            if (c && !reduceMotion) {
                var cl = c.cloneNode(true); // re-insert to replay the draw-in animation
                c.parentNode.replaceChild(cl, c);
            }
            showToast(isZh ? '♏ 天蝎座重新点亮' : '♏ Scorpius relit');
        } else if (typeBuf.endsWith('rocket')) {
            typeBuf = '';
            if (!reduceMotion) {
                var r = document.createElement('div');
                r.className = 'rocket-fly';
                r.textContent = '🚀';
                document.body.appendChild(r);
                setTimeout(function() { r.remove(); }, 3400);
            }
        }
    });

    // rare: ~4% of dark-mode visits get Van Gogh for free
    if (document.documentElement.dataset.theme === 'dark' && Math.random() < 0.04) {
        setTimeout(function() { starryNight(true); }, 2500);
    }

    // logo ×5 clicks within 3s: disco mode
    var logoEl = document.querySelector('.logo');
    var logoClicks = [];
    if (logoEl) {
        logoEl.addEventListener('click', function() {
            var now = Date.now();
            logoClicks = logoClicks.filter(function(t) { return now - t < 3000; });
            logoClicks.push(now);
            if (logoClicks.length >= 5) {
                logoClicks = [];
                document.body.classList.add('disco');
                setTimeout(function() { document.body.classList.remove('disco'); }, 10000);
                showToast(isZh ? '🪩 迪斯科时间！' : '🪩 Disco time!');
            }
        });
    }

    // late-night visitor (00:00–05:00), once per session
    var hourNow = today.getHours();
    if (hourNow >= 0 && hourNow < 5 && !sessionStorage.getItem('night-owl-toasted')) {
        sessionStorage.setItem('night-owl-toasted', '1');
        setTimeout(function() {
            showToast(isZh ? '🌙 这么晚还没睡？早点休息' : '🌙 Up late? Get some rest');
        }, 4000);
    }

    // copy toast
    document.addEventListener('copy', function() {
        showToast(isZh ? '📋 已复制' : '📋 Copied', 1500);
    });

    // draw a circle with the mouse: summon meteors (dark) / wake the sun (light)
    if (finePointer && !reduceMotion) {
        var pts = [];
        var circleCooldown = 0;
        document.addEventListener('mousemove', function(e) {
            var now = Date.now();
            pts.push({ x: e.clientX, y: e.clientY, t: now });
            while (pts.length && now - pts[0].t > 1200) pts.shift();
            if (pts.length < 12 || now < circleCooldown) return;
            var cx = 0, cy = 0;
            pts.forEach(function(p) { cx += p.x; cy += p.y; });
            cx /= pts.length; cy /= pts.length;
            var total = 0, prev = null;
            pts.forEach(function(p) {
                var a = Math.atan2(p.y - cy, p.x - cx);
                if (prev !== null) {
                    var d = a - prev;
                    if (d > Math.PI) d -= 2 * Math.PI;
                    if (d < -Math.PI) d += 2 * Math.PI;
                    total += d;
                }
                prev = a;
            });
            if (Math.abs(total) > Math.PI * 1.8) {
                circleCooldown = now + 15000;
                pts = [];
                if (document.documentElement.dataset.theme === 'dark') {
                    meteorBurst(10);
                    showToast(isZh ? '⭕ 你画了个圈，召唤了流星' : '⭕ Circle drawn — meteors summoned');
                } else {
                    document.body.classList.add('party-sky');
                    setTimeout(function() { document.body.classList.remove('party-sky'); }, 3000);
                    showToast(isZh ? '⭕ 你画了个圈，太阳精神了' : '⭕ Circle drawn — the sun perks up');
                }
            }
        }, { passive: true });
    }

    /**
     * 5. Scroll-Reveal Animations
     * Fades/slides entries into view with a subtle stagger
     */
    var revealTargets = document.querySelectorAll(
        '.post-entry, .archive-entry, .terms-tags li, .first-entry.home-info'
    );
    if (reduceMotion || !('IntersectionObserver' in window)) {
        return;
    }
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                var el = entry.target;
                el.classList.add('revealed');
                observer.unobserve(el);
                // Clear the entrance stagger so later hover transitions stay snappy
                setTimeout(function() { el.style.transitionDelay = '0ms'; }, 800);
            }
        });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    revealTargets.forEach(function(el, i) {
        el.classList.add('reveal');
        el.style.transitionDelay = Math.min(i * 70, 350) + 'ms';
        observer.observe(el);
    });
})();
</script>
