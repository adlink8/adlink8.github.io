<div id="scroll-progress" aria-hidden="true"></div>

<footer class="footer">
    <div id="quote-container" class="footer-quote"></div>
    <nav class="footer-links" aria-label="Footer">
        <a href="{{ "/now/" | relLangURL }}">{{ i18n "nav_now" }}</a>
        <span class="footer-sep">·</span>
        <a href="{{ "/archives/" | relLangURL }}">{{ i18n "nav_archives" }}</a>
        <span class="footer-sep">·</span>
        <a href="{{ "/stats/" | relLangURL }}">{{ i18n "nav_stats" }}</a>
        <span class="footer-sep">·</span>
        <a href="{{ "index.xml" | relLangURL }}" title="RSS Feed">RSS</a>
    </nav>
    <span>&copy; {{ now.Year }} {{ site.Title }}</span>
</footer>

<script>
(function() {
    'use strict';

    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /**
     * 0. Theme Toggle
     * The theme's own handler lives in its footer partial, which this file
     * overrides — so we re-implement it here (same localStorage keys).
     */
    var themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', function() {
            var html = document.querySelector('html');
            if (html.dataset.theme === 'dark') {
                html.dataset.theme = 'light';
                localStorage.setItem('pref-theme', 'light');
            } else {
                html.dataset.theme = 'dark';
                localStorage.setItem('pref-theme', 'dark');
            }
        });
    }

    /**
     * 1. Heart-Pop Interaction
     * Triggers a heart animation when clicking the profile avatar only
     */
    if (!reduceMotion) {
        document.addEventListener('click', function(e) {
            var avatar = e.target.closest('.home-info p:first-child img, .sidebar-avatar');
            if (!avatar) return;
            var heart = document.createElement('div');
            heart.textContent = '❤️';
            heart.className = 'heart-pop';
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            document.body.appendChild(heart);
            setTimeout(function() { heart.remove(); }, 1000);
        });
    }

    /**
     * 2. Random Quote Generator
     * Injects a random technical quote into the footer
     */
    var quotes = [
        '“Slow is smooth, smooth is fast.”'
    ];
    var quoteEl = document.getElementById('quote-container');
    if (quoteEl) {
        quoteEl.textContent = quotes[Math.floor(Math.random() * quotes.length)];
    }

    /**
     * 3. Console Easter Egg
     * Displays recruitment info in browser DevTools for inquisitive engineers
     */
    var recruitStyle = "background: #8a2be2; color: #fff; font-size: 20px; font-weight: bold; border-radius: 5px; padding: 10px;";
    console.log("%c Hi! Looking for a DevOps Engineer? ", recruitStyle);
    console.log("%c Contact me at: 2448366060l@email.com ", "color: #8a2be2; font-family: monospace;");

    /**
     * 4. Reading Progress Bar (rAF-throttled)
     */
    var progBar = document.getElementById('scroll-progress');
    if (progBar) {
        var ticking = false;
        var updateProgress = function() {
            var winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            var scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            progBar.style.width = scrolled + '%';
            ticking = false;
        };
        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(updateProgress);
                ticking = true;
            }
        }, { passive: true });
        updateProgress();
    }

    /**
     * 6. Code Block Language Labels
     * Replaces the decorative "zsh — 80x24" tag with the real language name
     */
    document.querySelectorAll('.post-content pre').forEach(function(pre) {
        if (pre.closest('.linenodiv')) return; // skip line-number gutter
        var host = pre.closest('.highlight') || pre;
        if (host.querySelector('.code-lang')) return; // one label per block
        var code = pre.querySelector('code');
        if (!code) return;
        var lang = code.getAttribute('data-lang')
            || (code.className.match(/language-(\w+)/) || [])[1]
            || 'text';
        host.classList.add('has-lang');
        var tag = document.createElement('span');
        tag.className = 'code-lang';
        tag.textContent = lang;
        host.appendChild(tag);
    });

    /**
     * 5. Scroll-Reveal Animations
     * Fades/slides entries into view with a subtle stagger
     */
    var revealTargets = document.querySelectorAll(
        '.post-entry, .archive-entry, .terms-tags li, .first-entry.home-info'
    );
    if (reduceMotion || !('IntersectionObserver' in window)) {
        return;
    }
    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                var el = entry.target;
                el.classList.add('revealed');
                observer.unobserve(el);
                // Clear the entrance stagger so later hover transitions stay snappy
                setTimeout(function() { el.style.transitionDelay = '0ms'; }, 800);
            }
        });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    revealTargets.forEach(function(el, i) {
        el.classList.add('reveal');
        el.style.transitionDelay = Math.min(i * 70, 350) + 'ms';
        observer.observe(el);
    });
})();
</script>
